name: Update prices and deploy

on:
  schedule:
    # Every evening after the US close (21:00 UTC in winter, 20:00 in summer), and again later to catch late prints.
    - cron: '35 21 * * *'
    - cron: '30 23 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deploy: ${{ steps.commit.outputs.changed == 'true' || github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test
        run: node --test

      - name: Download prices and rerun the models
        if: github.event_name != 'push'
        run: node scripts/update.mjs

      - name: Commit changed data
        id: commit
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Update prices $(date -u +%Y-%m-%d)"
            git push || echo "::warning::Could not push the data commit; the next run will retry."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new prices."
          fi

      - uses: actions/configure-pages@v6
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'

      - uses: actions/upload-pages-artifact@v5
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: .

  deploy:
    needs: update
    if: needs.update.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
